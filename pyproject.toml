[tool.poetry]
name = "image-ingestor"
version = "0.1.0"
description = "Places Photo Worker — fetches Google Places photo metadata via async background job"
authors = ["SleepinNinja <shuklapiyush993@gmail.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
asyncpg = "^0.29.0"
aiohttp = "^3.10.0"
alembic = "^1.13.0"
sqlalchemy = "^2.0.0"
psycopg2-binary = "^2.9.9"
pydantic-settings = "^2.4.0"
openpyxl = "^3.1.0"
python-json-logger = "^2.0.7"
python-multipart = "^0.0.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
