# Alembic configuration file.
# The sqlalchemy.url is intentionally left blank here; it is set at runtime
# in migrations/env.py by reading the DATABASE_URL environment variable.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Disable the file-level URL — env.py reads DATABASE_URL from the environment
sqlalchemy.url =

[post_write_hooks]
# No post-write hooks configured

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
